name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-refresh:
    name: Refresh vulnerable dependencies
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/phase-2-picker-favicon'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, fileinfo, gd, mbstring, pdo_sqlite, zip
          coverage: none
      - run: composer update guzzlehttp/guzzle paragonie/sodium_compat --with-dependencies --no-interaction --prefer-dist
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- composer.lock; then
            echo "composer.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Update audited Composer dependencies"
          git push

  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, gd, mbstring, pdo_sqlite, zip
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
      - run: node --check assets/app.js
      - run: node --check sw.js
      - run: node --check customer-guide/assets/help.js
      - if: matrix.php == '8.3'
        run: composer audit
