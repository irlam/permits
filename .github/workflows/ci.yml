name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, gd, mbstring, pdo_sqlite, zip
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
      - run: node --check assets/app.js
      - run: node --check assets/phase3-status.js
      - run: node --check assets/phase3c-picker.js
      - run: node --check assets/uk-date-display.js
      - run: node --check sw.js
      - run: node --check customer-guide/assets/help.js
      - if: matrix.php == '8.3'
        run: composer audit
